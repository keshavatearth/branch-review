<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Branch Review Sample</title>
<style>
/* Layout: one-screen workspace. Branch graph strip on top; list of changes left, detail right.
   Every color and face is a token; a review's data.theme overrides them (see README). */
:root{
  --surface:#f5f5f2; --raise:#ffffff; --inset:#ebebe6;
  --border:#dcdcd5; --border-strong:#c6c6bd;
  --ink:#1d1f22; --muted:#5f6368; --faint:#8d9096;
  --accent:#2f5b8a; --accent-soft:rgba(47,91,138,.10); --accent-ink:#ffffff;
  /* --brand fills shapes (mark, primary button, label bars); --accent colours text and strokes.
     They match by default; a bright brand colour sets them apart. */
  --brand:var(--accent); --brand-ink:var(--accent-ink);
  --panel:#1f2328; --panel-2:#2c3138; --panel-ink:#eef0f2; --panel-muted:#9aa1a9; --panel-line:#454b53;
  --ok:#3d7a4a; --ok-soft:rgba(61,122,74,.12);
  --warn:#9a6a14; --warn-soft:rgba(168,112,28,.14);
  --bad:#b0392b; --bad-soft:rgba(176,57,43,.11);
  --add:#3d7a4a; --del:#b0392b;
  --shadow:0 18px 50px rgba(20,24,30,.08);
  --f-display:ui-serif,"New York",Georgia,"Times New Roman",serif;
  --f-body:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --cut:7px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface:#151618; --raise:#1d1f22; --inset:#101113;
  --border:#2c2f33; --border-strong:#3b3f45;
  --ink:#eceef0; --muted:#a3a8ae; --faint:#6f747a;
  --accent:#8db3e2; --accent-soft:rgba(141,179,226,.14); --accent-ink:#10161d;
  --panel:#0d0e10; --panel-2:#23262b; --panel-ink:#eceef0; --panel-muted:#9aa1a9; --panel-line:#3b3f45;
  --ok:#8cc79a; --ok-soft:rgba(140,199,154,.13);
  --warn:#e2b05c; --warn-soft:rgba(226,176,92,.14);
  --bad:#f08b7c; --bad-soft:rgba(240,139,124,.13);
  --add:#8cc79a; --del:#f08b7c;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --surface:#151618; --raise:#1d1f22; --inset:#101113;
  --border:#2c2f33; --border-strong:#3b3f45;
  --ink:#eceef0; --muted:#a3a8ae; --faint:#6f747a;
  --accent:#8db3e2; --accent-soft:rgba(141,179,226,.14); --accent-ink:#10161d;
  --panel:#0d0e10; --panel-2:#23262b; --panel-ink:#eceef0; --panel-muted:#9aa1a9; --panel-line:#3b3f45;
  --ok:#8cc79a; --ok-soft:rgba(140,199,154,.13);
  --warn:#e2b05c; --warn-soft:rgba(226,176,92,.14);
  --bad:#f08b7c; --bad-soft:rgba(240,139,124,.13);
  --add:#8cc79a; --del:#f08b7c;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--f-mono);font-size:12px}

.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);padding-inline:16px}

.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px 10px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:16px;font-weight:600;flex:none}
.top h1{font:600 21px/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.top h1 span{color:var(--muted);font-weight:400}
.chips:empty{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--raise);border-radius:7px;padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.acc{background:var(--brand)}

.graph{display:flex;flex-direction:column;min-width:0;background:var(--raise);border:1px solid var(--border);border-radius:10px;clip-path:polygon(0 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%)}
.gscroll{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;padding-block:4px}
.gscroll svg{display:block;flex:none}
.ginner{display:flex;min-width:max-content}
.gbody{display:flex;min-width:0}
.gbar{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-bottom:1px solid var(--border)}
.gtitle{font:600 11px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.gzoom{margin-left:auto;display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;background:var(--surface)}
.gzoom button{display:grid;place-items:center;border:0;border-left:1px solid var(--border);background:transparent;min-width:30px;height:26px;padding:0 10px;font:500 12px/1 var(--f-body);cursor:pointer;color:var(--ink)}
.gzoom svg{width:12px;height:12px;display:block}
.gzoom button:first-child{border-left:0}
.gzoom button:hover:not(:disabled){background:var(--inset)}
.gzoom button:disabled{color:var(--faint);cursor:default}
.geye{width:32px;height:28px;display:grid;place-items:center;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--muted);cursor:pointer}
.geye:hover{color:var(--ink);border-color:var(--border-strong)}
.geye svg{width:17px;height:17px}
#glab{position:sticky;left:0;z-index:1;background:var(--raise);border-right:1px solid var(--border)}
.g-lane-name{font:600 12px var(--f-mono);fill:var(--ink)}
.g-lane-act{font:12px var(--f-body);fill:var(--muted)}
.g-lane-hit{fill:transparent;cursor:pointer}
.g-lane-hit:hover{fill:var(--accent-soft)}
.g-edge{stroke:var(--border-strong);stroke-width:2;fill:none}
.g-edge.l0{stroke:var(--muted)}
.g-date{font:11px var(--f-body);fill:var(--faint)}
.g-tick{stroke:var(--border);stroke-width:1}
.g-flag{font:600 11px var(--f-body);fill:var(--muted)}
.g-band{fill:var(--accent-soft)}
.node{cursor:pointer;transition:opacity .15s}
.node circle.ring{fill:none;stroke:var(--ink);stroke-width:2;opacity:0}
.node:hover circle.ring,.node:focus-visible circle.ring{opacity:.35}
.node.sel circle.ring{opacity:1}
.node.dim{opacity:.22}
.node:focus{outline:none}
.legend{display:flex;flex-direction:column;gap:7px;width:210px;flex:none;padding:16px 16px 14px;border-left:1px solid var(--border);font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.legend i.hollow{background:transparent;border:2px solid var(--muted)}
.legend .hint{margin-top:auto;color:var(--faint);line-height:1.4}
@media (max-width:1200px){.gbody{flex-direction:column}.legend{flex-direction:row;flex-wrap:wrap;width:auto;gap:8px 14px;padding:8px 14px 10px;border-left:0;border-top:1px solid var(--border)}.legend .hint{margin-top:0;margin-left:auto}}

.work{display:grid;grid-template-columns:268px minmax(0,1fr);gap:14px;min-height:0;padding-block:14px 16px}
.nav{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:2px}
.nav h4{margin:0 0 4px;padding-left:10px;font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.nav .grp{display:flex;flex-direction:column;gap:2px}
.nav button{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;border-radius:7px;padding:7px 10px;cursor:pointer}
.nav button:hover{background:var(--inset)}
.nav button.on{background:var(--ink);color:var(--surface)}
.nav button.on .st{color:var(--surface);opacity:.75}
.nav .lbl{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .st{font-size:11.5px;color:var(--muted);white-space:nowrap}
.sw{width:8px;height:8px;border-radius:50%;flex:none}

.detail{min-height:0;overflow:auto;background:var(--raise);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);clip-path:polygon(0 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%)}
.pane{padding:22px 26px 30px;display:flex;flex-direction:column;gap:18px;max-width:1000px}
.eyebrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.eyebrow code{background:var(--inset);padding:1px 6px;border-radius:4px;color:var(--ink)}
.pane h2{font:600 28px/1.15 var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance}
.lede{font-size:15.5px;line-height:1.55;max-width:70ch;margin:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:6px;white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-soft)}
.pill.warn{color:var(--warn);background:var(--warn-soft)}
.pill.bad{color:var(--bad);background:var(--bad-soft)}
.pill.nt{color:var(--muted);background:var(--inset)}
.pill.acc{color:var(--accent);background:var(--accent-soft)}

.label{font:600 11px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;margin:0 0 8px}
.label::before{content:"";width:3px;height:12px;background:var(--brand);border-radius:1px;flex:none}
.label span{text-transform:none;letter-spacing:0;font-weight:400}

.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
.bul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.bul li{position:relative;padding-left:16px;max-width:66ch}
.bul li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--faint)}
.bul b{font-weight:600}
.bul code,.lede code,.callout code,.asks code,.steps code{background:var(--inset);padding:0 4px;border-radius:3px}

.shot{margin:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--inset)}
.shot img{display:block;width:100%;height:auto}
.shot figcaption{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);background:var(--raise)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--surface)}

.callout{border:1px solid var(--border);border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:12px 14px}
.callout.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.callout.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.callout.info{border-left-color:var(--accent);background:var(--accent-soft)}
.callout h5{margin:0 0 4px;font-size:13.5px}
.callout p{margin:0;max-width:74ch}
.callout ol,.callout ul{margin:6px 0 0;padding-left:20px}
.callout li{margin:2px 0}

.ccs{display:flex;flex-wrap:wrap;gap:6px}
.cc{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:4px 9px;cursor:pointer;font-size:13px;max-width:100%}
.cc:hover{border-color:var(--border-strong);background:var(--inset)}
.cc code{color:var(--accent)}
.cc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.files{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.files details{border-top:1px solid var(--border)}
.files details:first-child{border-top:0}
.files summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) 120px 96px;gap:10px;align-items:center;padding:7px 10px;cursor:pointer;font-size:13px}
.files summary::-webkit-details-marker{display:none}
.files summary:hover{background:var(--inset)}
.files .fn{font-family:var(--f-mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .fn::before{content:"▸ ";color:var(--faint)}
.files details[open] .fn::before{content:"▾ "}
.bar{height:6px;border-radius:3px;background:var(--inset);display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.bar .a{background:var(--add)}.bar .d{background:var(--del)}
.num{font:12px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.num .a{color:var(--add)}.num .d{color:var(--del)}
.flist{padding:2px 10px 8px 26px;display:flex;flex-direction:column;gap:2px}
.flist div{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px;font-size:12px}
.flist .p{font-family:var(--f-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{font-size:12px;color:var(--muted);padding:6px 10px;border-top:1px solid var(--border)}

/* diffs: one expandable row per file, filled in when opened */
.diffs{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.diffs details{border-top:1px solid var(--border)}
.diffs details:first-child{border-top:0}
.diffs summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto 96px;gap:10px;align-items:center;padding:7px 10px;cursor:pointer;font-size:13px}
.diffs summary::-webkit-details-marker{display:none}
.diffs summary:hover{background:var(--inset)}
.diffs .fn{font-family:var(--f-mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.diffs .fn::before{content:"▸ ";color:var(--faint)}
.diffs details[open] .fn::before{content:"▾ "}
.diffs .via{font-size:11.5px;color:var(--faint);font-family:var(--f-mono)}
.diff{margin:0;font:12px/1.5 var(--f-mono);background:var(--surface);border-top:1px solid var(--border);overflow-x:auto;max-height:70vh;overflow-y:auto;tab-size:4}
.diff span{display:block;padding:0 12px;white-space:pre;min-width:max-content}
.diff .a{background:var(--ok-soft);color:var(--ink)}
.diff .d{background:var(--bad-soft);color:var(--ink)}
.diff .h{color:var(--accent);background:var(--accent-soft);margin-top:4px}
.diff .x{color:var(--faint);font-style:italic}

/* copyable commit ids: a small copy button appears on hover or focus */
.cchip{position:relative;display:inline-flex;max-width:100%}
.cpy{position:absolute;top:-9px;left:-9px;width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--border-strong);border-radius:6px;background:var(--raise);color:var(--muted);cursor:pointer;opacity:0;transform:scale(.9);transition:opacity .12s,transform .12s;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.cchip:hover .cpy,.cchip:focus-within .cpy,.cpy:focus-visible{opacity:1;transform:none}
.cpy:hover{color:var(--ink);border-color:var(--ink)}
.cpy svg,.hash svg{width:12px;height:12px}
.cpy.done,.hash.done{color:var(--ok);border-color:var(--ok)}
.hash{display:inline-flex;align-items:center;gap:6px;font:12px var(--f-mono);color:var(--ink);background:var(--inset);border:1px solid var(--border);border-radius:5px;padding:2px 7px;cursor:pointer}
.hash svg{color:var(--muted)}
.hash:hover{border-color:var(--border-strong)}
.hash:hover svg{color:var(--ink)}
.hash .ok{display:none;font:600 11px var(--f-body);color:var(--ok)}
.hash.done .ok{display:inline}.hash.done svg{display:none}

/* boards and commits look different: a commit page has a tag, a stream-coloured edge and a plainer title */
.kind{font:600 10px var(--f-body);letter-spacing:.11em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--inset);color:var(--muted);border:1px solid var(--border)}
.kind.commit{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pane.commit-pane h2{font:600 21px/1.3 var(--f-body);letter-spacing:-.005em}
#detail.is-commit{background:var(--surface)}
.cnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cnav .back{margin-right:auto}
.cstep{display:inline-flex;align-items:center;gap:6px;max-width:300px;border:1px solid var(--border);background:var(--raise);border-radius:7px;padding:4px 9px;font-size:12.5px;color:var(--muted);cursor:pointer}
.cstep:hover{border-color:var(--border-strong);color:var(--ink)}
.cstep code{color:var(--accent);flex:none}
.cstep span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cstep b{font-weight:600;color:var(--ink);flex:none}
.back{align-self:flex-start;border:0;background:none;padding:0;font-size:13px;color:var(--accent);cursor:pointer}
.back:hover{text-decoration:underline}
.hood{display:flex;flex-direction:column;gap:16px;margin-top:6px;padding:16px 16px 18px;border-radius:10px;background:var(--surface);border:1px dashed var(--border-strong)}
.hood-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hood-h b{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.hood-h span{font-size:12.5px;color:var(--muted)}

/* explainer: what the page is and how to read it */
.helpbtn{border:1px solid var(--border);background:var(--raise);color:var(--ink);border-radius:7px;padding:3px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
.helpbtn:hover{border-color:var(--border-strong)}
.top{position:relative}
.explainer{display:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;background:var(--raise);border:1px solid var(--border-strong);border-radius:10px;padding:16px 18px;position:absolute;top:calc(100% + 2px);left:0;right:0;z-index:30;box-shadow:var(--shadow),0 12px 30px rgba(0,0,0,.12)}
.explainer.open{display:grid}
.explainer h6{margin:0 0 5px;font:600 11px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.explainer p{margin:0;font-size:13px;line-height:1.5;color:var(--ink)}
.explainer p+p{margin-top:6px}
.explainer .x{position:absolute;top:10px;right:12px;border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:2px 10px;font-size:12px;cursor:pointer}
.explainer .dot-f,.explainer .dot-h{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:-1px;background:var(--muted)}
.explainer .dot-h{background:transparent;border:2px solid var(--muted);width:7px;height:7px}

/* group: one slice of a big commit, what it adds / changes / removes, then its diffs */
.gblock{border:1px solid var(--border);border-radius:10px;padding:14px 14px 12px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.gblock h4{margin:0;font:600 17px/1.25 var(--f-display);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gblock h4 .num{font-weight:400}
.gdl{display:grid;grid-template-columns:72px minmax(0,1fr);gap:5px 12px;margin:0;font-size:14px;line-height:1.5}
.gdl dt{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding-top:3px}
.gdl dt.adds{color:var(--ok)}.gdl dt.changes{color:var(--warn)}.gdl dt.removes{color:var(--bad)}.gdl dt.note{color:var(--muted)}
.gdl dd{margin:0;max-width:74ch}
.gdl code{background:var(--inset);padding:0 4px;border-radius:3px}

/* table: rows of cells (HTML allowed); a cell given as [kind, text] renders as a pill */
.tbl{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:13.5px;background:var(--surface)}
.tbl th{font:600 11px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;background:var(--inset);border-bottom:1px solid var(--border)}
.tbl td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:top;line-height:1.45}
.tbl tr:first-child td{border-top:0}
.tbl td code{background:var(--inset);padding:0 4px;border-radius:3px}
.tbl td .cc{font-size:12px;padding:2px 7px}
.tbl tr.sec td{background:var(--inset);font:600 11px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 10px}
@media (max-width:860px){.tbl{font-size:12.5px}.tbl th,.tbl td{padding:6px 7px}}

/* verdicts: the reader's call on each item, kept in this browser and copied out as text */
.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px}
.verdict .vl{font:600 11px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.verdict button{border:1px solid var(--border);background:var(--raise);border-radius:7px;padding:4px 12px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.verdict button:hover{border-color:var(--border-strong)}
.verdict button small{font-size:10.5px;color:var(--faint)}
.verdict button.on{color:var(--raise);border-color:transparent}
.verdict button.on small{color:inherit;opacity:.8}
.verdict button.on.ok{background:var(--ok)}.verdict button.on.warn{background:var(--warn)}.verdict button.on.bad{background:var(--bad)}.verdict button.on.nt{background:var(--muted)}
.verdict textarea{flex:1 1 100%;min-height:38px;resize:vertical;border:1px solid var(--border);border-radius:7px;background:var(--raise);color:var(--ink);font:13px/1.45 var(--f-body);padding:6px 9px;margin-top:4px}
.nav .st.v-ok{color:var(--ok)}.nav .st.v-warn{color:var(--warn)}.nav .st.v-bad{color:var(--bad)}
.nav button.on .st[class*="v-"]{color:var(--surface)}
.vcopy{border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:7px;padding:3px 12px;font-size:12px;cursor:pointer;white-space:nowrap}

.msg{white-space:pre-wrap;font:13px/1.6 var(--f-mono);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:0;max-width:88ch;overflow-x:auto}

/* before / after lists, drawn as two app sidebars */
.ba{display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1.35fr);gap:8px;align-items:stretch;max-width:620px}
.side{background:var(--panel);color:var(--panel-ink);border-radius:12px;padding:12px 8px 10px;display:flex;flex-direction:column;gap:2px}
.side .ver{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--panel-muted);padding:0 8px 8px;display:flex;justify-content:space-between;gap:8px}
.side .row{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;font-size:13.5px;border:0;background:transparent;color:inherit;width:100%;text-align:left}
.side button.row{cursor:pointer}
.side button.row:hover{background:var(--panel-2)}
.side .row .tag{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--panel-2);color:var(--panel-muted);white-space:nowrap}
.side .row .tag.new{background:var(--brand);color:var(--brand-ink)}
.side .row .tag.chg{background:transparent;border:1px solid var(--panel-line);color:var(--panel-ink)}
.side .row .tag.bad{background:var(--bad);color:var(--panel)}
.side .row .why{display:block;font-size:11.5px;color:var(--panel-muted);margin-top:1px}
.side .row .txt{min-width:0}
.side .row.dimrow{color:var(--panel-muted)}
.side .row.gone{color:var(--panel-muted);text-decoration:line-through;text-decoration-color:var(--panel-line)}
.arrow{display:grid;place-items:center;color:var(--faint);font-size:20px}

.asks{display:flex;flex-direction:column;gap:8px}
.ask{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:10px 12px 10px 0;background:var(--surface);text-align:left;width:100%}
button.ask{cursor:pointer}
button.ask:hover{border-color:var(--border-strong)}
.ask .sev{align-self:stretch;border-radius:0 3px 3px 0;background:var(--warn)}
.ask .sev.bad{background:var(--bad)}.ask .sev.ok{background:var(--ok)}.ask .sev.info{background:var(--brand)}.ask .sev.nt{background:var(--border-strong)}
.ask>span>b{display:block;font-size:14px;color:var(--ink)}
.ask span span b{color:var(--ink);font-weight:600}
.ask span{font-size:13px;color:var(--muted)}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.path .st2{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:3px 9px;color:var(--ink)}

.mock{border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mock .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.mock .t{font-size:14.5px;line-height:1.5}
.mock .t.mono{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.mock button{align-self:flex-start;border:1px solid var(--border);background:var(--raise);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--accent)}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;font:600 12px var(--f-body);color:var(--muted)}
.steps li.done::before{content:"✓";border-color:var(--ok);color:var(--ok)}
.steps b{display:block}
.steps p{margin:2px 0 0;color:var(--muted);max-width:72ch}
.cmd{display:flex;align-items:center;gap:8px;margin-top:6px;background:var(--panel);color:var(--panel-ink);border-radius:7px;padding:7px 8px 7px 12px;max-width:780px}
.cmd code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;font-size:12.5px;background:none;padding:0}
.cmd button{border:1px solid var(--panel-line);background:transparent;color:var(--panel-muted);border-radius:5px;padding:2px 9px;font-size:11.5px;cursor:pointer}
.cmd button:hover{color:var(--panel-ink)}

/* split screen (half a laptop screen) and narrower: one column, boards in a drawer, the graph on request */
.work{grid-row:3}
.app{grid-template-columns:minmax(0,1fr)}
.graph,.top,.work{min-width:0}
.app.nograph .gbody,.app.nograph .gzoom{display:none}
.app.nograph .gbar{border-bottom:0}
.app.nograph .geye{margin-left:auto}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
.top .chips{order:3;flex:1 0 100%;margin-left:0}
.helpbtn[aria-pressed="false"]{color:var(--muted)}
.boardbar{display:none}
@media (max-width:1000px){
  .top{gap:8px 10px;padding-block:12px 8px}
  .top h1{font-size:18px}
  .top .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .work{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);position:relative;gap:8px;padding-block:8px 12px}
  .boardbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,max-content) minmax(0,1fr);gap:6px;align-items:stretch}
  .bb-side{display:flex;align-items:center;gap:7px;min-width:0;border:1px solid var(--border);background:var(--raise);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:13px;text-align:left}
  .bb-side.bb-next{justify-content:flex-end;text-align:right}
  .bb-side:hover:not(:disabled){border-color:var(--border-strong);color:var(--ink)}
  .bb-side:disabled{visibility:hidden}
  .bb-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bb-arr{flex:none;font-size:17px;line-height:1;color:var(--ink)}
  .bb-list{display:flex;align-items:center;gap:8px;min-width:0;max-width:min(52vw,420px);border:1px solid var(--ink);background:var(--ink);color:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer}
  .bb-cur{display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap}
  .bb-cur b{min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:14px}
  .bb-st{flex:none;font-size:11.5px;opacity:.72}
  .bb-cur code{background:transparent;color:inherit;font-size:12.5px}
  .bb-ico{opacity:.8;flex:none}
  .cnav .cstep{display:none}
  .boardbar.on-commit .bb-list{background:var(--raise);color:var(--ink);border-color:var(--border-strong)}
  .boardbar.on-commit .bb-st{opacity:1;color:var(--muted)}
  .boardbar.on-commit .bb-cur code{color:var(--accent)}
  .nav{display:none;position:absolute;top:52px;left:0;width:min(360px,100%);max-height:calc(100% - 60px);z-index:25;background:var(--raise);border:1px solid var(--border-strong);border-radius:10px;padding:12px 8px;box-shadow:0 16px 40px rgba(0,0,0,.18)}
  .nav.open{display:flex}
  .pane{padding:18px 18px 24px}
  .pane h2{font-size:24px}
  .cols{grid-template-columns:1fr}
  .ba{grid-template-columns:1fr}
  .arrow{transform:rotate(90deg);height:24px}
  .files summary,.diffs summary{grid-template-columns:minmax(0,1fr) 70px 88px}
  .explainer{grid-template-columns:repeat(2,minmax(0,1fr))}
  .legend .hint{display:none}
}
@media (max-width:600px){
  .explainer{grid-template-columns:1fr}
  .explainer .x{position:static;justify-self:start}
  .top h1 span{display:block;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <div class="work">

"rows": [{"text": "The later save wins"}, {"text": "The other edit is gone", "gone": true}]}, "after": {"title": "this branch", "note": "", "rows": [{"text": "The newer version stays in place"}, {"text": "The older one becomes a copy", "why": "with the device name in its title", "tag": "new", "tagKind": "new"}, {"text": "A banner explains the copy", "tag": "new", "tagKind": "new"}]}}], "callouts": [{"sev": "bad", "h": "Data loss in 1.2.1", "p": "Anyone using Lumen on two Macs can lose an edit today, so this should ship as soon as it's ready, as 1.2.2."}, {"sev": "warn", "h": "One thing to change", "p": "The conflict banner has no close button, so it stays on the note forever. Add one, then this is ready."}], "cmds": ["git switch fix/sync-conflicts && make test-sync"], "commits": ["a0b1c2d", "b1c2d3e", "c2d3e4f"]}, {"id": "sharing", "group": "Parked", "label": "Sharing links", "status": ["nt", "parked"], "review": true, "rec": "park", "stream": "app", "where": "feature/sharing", "title": "Sharing: a read-only link to one note", "lede": "Share a single note as a link anyone can read, without an account. Links expire after 30 days.", "mock": {"label": "What the reader sees", "meta": ["share.lumen.app/n/…", "read-only"], "a": {"text": "Grocery list · shared by Sam · expires in 30 days", "btn": "Show an expired link"}, "b": {"text": "This link has expired. Ask Sam for a new one.", "btn": "Show a live link", "mono": false}}, "bulletsLabel": "Where it stands", "bullets": ["The app side is done: the share sheet and links that expire after 30 days.", "There's no server yet to host the shared notes."], "callouts": [{"sev": "info", "h": "Why it's parked", "p": "Hosting shared notes is the first thing Lumen would run on a server. Decide that on its own, then come back to this branch."}], "commits": ["d3e4f5a", "e4f5a6b"]}, {"id": "launch", "group": "Website", "label": "1.3 launch page", "status": ["warn", "after search"], "review": true, "rec": "approve", "stream": "site", "where": "site/1.3-launch", "title": "The 1.3 launch page", "lede": "A page for 1.3 built around search: a short demo, three screenshots, and what's new.", "callouts": [{"sev": "warn", "h": "Goes live with 1.3", "p": "It shows search, so publish it only once search is on <code>main<\/code> and 1.3 is out."}], "bulletsLabel": "What's on it", "bullets": ["A 20-second search demo, muted and looping.", "Three screenshots: the field, highlighted results, and a PDF match.", "A short what's-new list, and the download button."], "commits": ["f5a6b7c", "a6b7c8d"]}, {"id": "release", "group": "On main", "label": "1.2.1 release", "status": ["ok", "shipped 6 Nov"], "stream": "release", "where": "main", "title": "Lumen 1.2.1, shipped 6 Nov", "lede": "A small release: a tidier settings screen and a crash fix for notes imported without a title.", "blocks": [{"type": "steps", "label": "How it went out", "rows": [{"done": true, "title": "Settings tidied", "text": "Sync options grouped; two unused settings removed."}, {"done": true, "title": "Crash on untitled notes fixed", "item": "carryover", "itemText": "Carry-over", "text": "Notes imported from plain text can arrive without a title."}, {"done": true, "title": "Released", "text": "Signed, notarized, and offered as an update."}]}], "commits": ["2b3c4d5", "3c4d5e6", "4d5e6f7", "5e6f7a8"]}, {"id": "next", "group": "Next", "label": "Order of work", "status": ["acc", "steps"], "commits": [], "title": "Order of work from here", "blocks": [{"type": "steps", "label": "From here", "rows": [{"title": "Add the banner's close button, ship 1.2.2", "item": "sync", "itemText": "Sync"}, {"title": "Carry search over to main", "item": "search", "itemText": "Search"}, {"title": "Release 1.3 and publish the launch page", "item": "launch", "itemText": "Launch page"}, {"title": "Decide on hosting, then pick sharing back up", "item": "sharing", "itemText": "Sharing"}]}]}]}</script>
<script>
const D = JSON.parse(document.getElementById("review-data").textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill = (k, t) => `<span class="pill ${k}">${esc(t)}</span>`;

/* ---------- theme: data.theme and stream colors become CSS tokens ---------- */
(function applyTheme(){
  const light = {...(D.theme?.light || {})}, dark = {...(D.theme?.dark || {})};
  for (const [k, s] of Object.entries(D.streams || {})) { light[`--s-${k}`] = s.light; dark[`--s-${k}`] = s.dark || s.light; }
  const css = o => Object.entries(o).map(([k, v]) => `${k}:${v}`).join(";");
  const el = document.createElement("style");
  el.textContent = `:root{${css(light)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){${css(dark)};color-scheme:dark}}
:root[data-theme="dark"]{${css(dark)};color-scheme:dark}`;
  document.head.appendChild(el);
})();
const streamVar = k => (D.streams && D.streams[k]) ? `var(--s-${k})` : "var(--faint)";

/* ---------- data ---------- */
const COMMITS = {};
for (const c of D.commits) {
  const lines = (c.body || "").split("\n").filter(l => !/^Co-Authored-By:/i.test(l));
  COMMITS[c.h] = {...c, message: lines.join("\n").trim()};
}
const ITEMS = D.items || [];
const BY_ID = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const itemsOf = h => ITEMS.filter(i => (i.commits || []).includes(h));

/* ---------- header ---------- */
document.title = D.pageTitle || `${D.title} ${D.subtitle || ""}`.trim();
$("#mark").textContent = D.mark || (D.title || "?").slice(0, 1);
$("#title").innerHTML = `${esc(D.title)}${D.subtitle ? ` <span>· ${esc(D.subtitle)}</span>` : ""}`;
$("#chips").innerHTML = (D.chips || []).map(c => `<span class="chip"><i class="dot ${c.dot || ""}"></i><span>${c.html}</span></span>`).join("");

/* ---------- graph ---------- */
function drawGraph(){
  const lanes = D.lanes, cs = Object.values(COMMITS);
  const maxCol = Math.max(...cs.map(c => c.col));
  // Branch names live in their own pinned column; the dots sit beside them.
  // The column is as wide as its text needs, but never more than about a
  // quarter of the graph: when space is tight the text steps down a size,
  // then shortens with an ellipsis (hover shows it whole).
  const GW = $("#gscroll").clientWidth || 900;
  const natural = (nameCh, noteCh) => Math.max(...lanes.map(l => Math.max(l.name.length * nameCh, (l.note || "").length * noteCh))) + 30;
  const cap = Math.max(140, Math.min(300, GW * 0.26));
  const small = natural(7.2, 6.1) > cap, nameCh = small ? 6.3 : 7.2, noteCh = small ? 5.4 : 6.1, fs = small ? 10.5 : 12;
  const LW = Math.round(Math.min(cap, Math.max(140, natural(nameCh, noteCh)))), PAD = 26, DY = 34;
  const clip = (t, ch) => { const n = Math.floor((LW - 24) / ch); return t.length > n ? t.slice(0, Math.max(1, n - 1)) + "…" : t; };
  // Zoom 0 fits the whole timeline to the width; each step in spreads it out.
  const avail = Math.max(0, GW - LW - PAD - 46);
  const fitDX = Math.min(56, Math.max(16, avail / Math.max(1, maxCol)));
  const DX = fitDX * Math.pow(1.5, ZOOM);
  const Y0 = (D.ticks && D.ticks.length) ? 52 : 30;
  const cx = c => PAD + c * DX, cy = l => Y0 + l * DY;
  const W = cx(maxCol) + 40, H = cy(lanes.length - 1) + 26;
  let s = "", l = "";
  // A date label shortens to fit its range when the timeline is tight; hover shows it whole.
  const fit = (label, px) => { const n = Math.max(3, Math.floor(px / 5.8)); return label.length > n ? label.slice(0, n - 1) + "…" : label; };
  for (const t of D.ticks || []) {
    if (t.to !== undefined) {
      const span = cx(t.to) - cx(t.from) + 16;
      s += `<line class="g-tick" x1="${cx(t.from)-8}" y1="22" x2="${cx(t.to)+8}" y2="22"/><line class="g-tick" x1="${cx(t.from)-8}" y1="18" x2="${cx(t.from)-8}" y2="26"/><line class="g-tick" x1="${cx(t.to)+8}" y1="18" x2="${cx(t.to)+8}" y2="26"/>`;
      s += `<text class="g-date" x="${(cx(t.from)+cx(t.to))/2}" y="15" text-anchor="middle"><title>${esc(t.label)}</title>${esc(fit(t.label, span))}</text>`;
    } else s += `<text class="g-date" x="${cx(t.col)}" y="15" text-anchor="middle"><title>${esc(t.label)}</title>${esc(fit(t.label, Math.max(40, DX * 2)))}</text>`;
  }
  for (const b of D.bands || []) s += `<rect class="g-band" x="${cx(b.from)-14}" y="${cy(b.lane)-14}" width="${cx(b.to)-cx(b.from)+28}" height="28" rx="14"/>`;
  lanes.forEach((ln, i) => {
    const y = cy(i);
    l += `<rect class="g-lane-hit" ${ln.item ? `data-item="${esc(ln.item)}"` : ""} x="4" y="${y-16}" width="${LW-12}" height="32" rx="6"><title>${esc(ln.name + (ln.note ? " · " + ln.note : ""))}</title></rect>`;
    l += `<text class="g-lane-name" x="12" y="${y-2}" style="font-size:${fs}px" pointer-events="none">${esc(clip(ln.name, nameCh))}</text>`;
    l += `<text class="g-lane-act" x="12" y="${y+12}" style="font-size:${fs}px" pointer-events="none">${esc(clip(ln.note || "", noteCh))}</text>`;
  });
  for (const c of cs) for (const p of c.parents || []) {
    const pc = COMMITS[p]; if (!pc) continue;
    const x1 = cx(pc.col), y1 = cy(pc.lane), x2 = cx(c.col), y2 = cy(c.lane);
    const d = y1 === y2 ? `M${x1} ${y1} L${x2} ${y2}` : `M${x1} ${y1} C ${x1+22} ${y1}, ${x2-30} ${y2}, ${x2} ${y2}`;
    s += `<path class="g-edge${c.lane === 0 && pc.lane === 0 ? " l0" : ""}" d="${d}"/>`;
  }
  for (const f of D.flags || []) s += `<text class="g-flag" x="${cx(f.col)}" y="${cy(f.lane)+26}" text-anchor="middle">${esc(f.text)}</text>`;
  for (const c of cs) {
    const col = streamVar(c.stream), x = cx(c.col), y = cy(c.lane);
    const r = c.state === "base" ? 5.5 : 7.5;
    const fill = c.state === "local" ? "var(--raise)" : col, stroke = c.state === "local" ? col : "var(--raise)";
    s += `<g class="node" data-commit="${c.h}" tabindex="0" role="button" aria-label="${esc(c.h + " " + c.subject)}"><title>${esc(`${c.h} · ${c.date}${c.state === "local" ? " · not pushed" : ""}\n${c.subject}`)}</title><circle class="ring" cx="${x}" cy="${y}" r="11.5"/><circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/></g>`;
  }
  const svg = $("#g"), lab = $("#glab");
  for (const [el, w, html] of [[svg, W, s], [lab, LW, l]]) {
    el.setAttribute("viewBox", `0 0 ${w} ${H}`); el.setAttribute("width", w); el.setAttribute("height", H); el.innerHTML = html;
  }
  const used = new Set(cs.map(c => c.stream));
  $("#legend").innerHTML = Object.entries(D.streams || {}).filter(([k]) => used.has(k)).map(([k, s]) => `<span><i style="background:${streamVar(k)}"></i>${esc(s.label)}</span>`).join("")
    + (cs.some(c => c.state === "local") ? `<span><i class="hollow"></i>Hollow: not pushed yet</span>` : "")
    + `<span class="hint">${esc(D.graphHint || "Click a dot to open that commit. Click a branch name for its summary.")}</span>`;
}
let ZOOM = 0, HL = [null, null];
function graphEvents(){
  const onClick = e => {
    const n = e.target.closest("[data-commit]"); if (n) return select({commit: n.dataset.commit});
    const i = e.target.closest("[data-item]"); if (i) return select({item: i.dataset.item});
  };
  $("#g").addEventListener("click", onClick); $("#glab").addEventListener("click", onClick);
  $("#g").addEventListener("keydown", e => {
    const h = e.target.closest?.("[data-commit]")?.dataset.commit;
    if ((e.key === "Enter" || e.key === " ") && h) { e.preventDefault(); select({commit: h}); }
  });
}
function zoomTo(z){
  const g = $("#gscroll"), mid = (g.scrollLeft + g.clientWidth / 2) / Math.max(1, g.scrollWidth);
  ZOOM = Math.max(0, Math.min(5, z));
  drawGraph(); highlight(...HL);
  g.scrollLeft = mid * g.scrollWidth - g.clientWidth / 2;
  $("#zout").disabled = ZOOM === 0; $("#zfit").disabled = ZOOM === 0; $("#zin").disabled = ZOOM === 5;
}
function highlight(hs, selH){
  HL = [hs, selH];
  document.querySelectorAll(".node").forEach(n => {
    const h = n.dataset.commit;
    n.classList.toggle("dim", !!hs && !hs.includes(h));
    n.classList.toggle("sel", h === selH);
  });
}

/* ---------- nav ---------- */
function drawNav(){
  const groups = [...new Set(ITEMS.map(i => i.group))];
  $("#nav").innerHTML = groups.map(g => `<div class="grp"><h4>${esc(g)}</h4>${ITEMS.filter(i => i.group === g).map(i =>
    `<button data-item="${esc(i.id)}"><i class="sw" style="background:${i.stream ? streamVar(i.stream) : "var(--ink)"}"></i><span class="lbl">${esc(i.label)}</span><span class="st">${esc(i.status?.[1] || "")}</span></button>`).join("")}</div>`).join("");
  $("#nav").addEventListener("click", e => { const b = e.target.closest("[data-item]"); if (b) select({item: b.dataset.item}); });
}

/* ---------- files ---------- */
function groupKey(p){
  for (const g of D.fileGroups || []) if (p.startsWith(g.prefix)) return g.label;
  if (p.includes("=>")) return "renamed";
  const parts = p.split("/");
  return parts.length > 1 ? parts.slice(0, -1).join("/") : "(repo root)";
}
const numHTML = (a, d) => a < 0 ? `<span class="num">binary</span>` : `<span class="num"><span class="a">+${a.toLocaleString()}</span> <span class="d">−${d.toLocaleString()}</span></span>`;
function filesHTML(files, limit = 9){
  if (!files.length) return `<p class="lede" style="color:var(--muted)">No files.</p>`;
  const groups = {};
  for (const [p, a, d] of files) {
    const k = groupKey(p), g = (groups[k] ||= {k, a: 0, d: 0, bin: 0, files: []});
    if (a < 0) g.bin++; else { g.a += a; g.d += d; }
    g.files.push([p, a, d]);
  }
  const gs = Object.values(groups).sort((x, y) => (y.a + y.d + y.bin * 50) - (x.a + x.d + x.bin * 50));
  const max = Math.max(...gs.map(g => g.a + g.d), 1);
  const rows = gs.slice(0, limit).map(g => {
    const fl = g.files.sort((x, y) => (y[1] + y[2]) - (x[1] + x[2])).slice(0, 30)
      .map(([p, a, d]) => `<div><span class="p" title="${esc(p)}">${esc(p)}</span>${numHTML(a, d)}</div>`).join("");
    const extra = g.files.length > 30 ? `<div><span class="p">…and ${g.files.length - 30} more</span><span></span></div>` : "";
    return `<details><summary><span class="fn" title="${esc(g.k)}">${esc(g.k)} <span style="color:var(--faint)">· ${g.files.length}</span></span><span class="bar"><i class="a" style="width:${(g.a/max*100).toFixed(1)}%"></i><i class="d" style="width:${(g.d/max*100).toFixed(1)}%"></i></span>${g.bin && !g.a && !g.d ? `<span class="num">binary</span>` : numHTML(g.a, g.d)}</summary><div class="flist">${fl}${extra}</div></details>`;
  }).join("");
  return `<div class="files">${rows}${gs.length > limit ? `<div class="more">+ ${gs.length - limit} more folders</div>` : ""}</div>`;
}
const totals = files => files.reduce((t, f) => [t[0] + Math.max(0, f[1]), t[1] + Math.max(0, f[2])], [0, 0]);
const totalsHTML = files => { const [a, d] = totals(files); return `<span>${files.length} files, <span style="color:var(--add)">+${a.toLocaleString()}</span> <span style="color:var(--del)">−${d.toLocaleString()}</span></span>`; };

/* ---------- diffs ---------- */
// c.patches = {path: unified diff text from the first @@}. Rows render empty and fill on open.
const PATCHES = [];
function diffRows(list){
  if (!list.length) return "";
  return `<div class="diffs">${list.map(([h, p, a, d]) => { PATCHES.push(COMMITS[h].patches[p]);
    return `<details data-patch="${PATCHES.length - 1}"><summary><span class="fn" title="${esc(p)}">${esc(p)}</span><span class="via">${h}</span>${numHTML(a, d)}</summary></details>`; }).join("")}</div>`;
}
function diffHTML(t){
  return `<pre class="diff">${t.split("\n").map(l => `<span class="${l.startsWith("@@") ? "h" : l.startsWith("+") ? "a" : l.startsWith("-") ? "d" : l.startsWith("…") ? "x" : ""}">${esc(l) || " "}</span>`).join("")}</pre>`;
}
document.addEventListener("toggle", e => {
  const d = e.target; if (!d.matches?.("details[data-patch]") || !d.open || d.dataset.done) return;
  d.insertAdjacentHTML("beforeend", diffHTML(PATCHES[+d.dataset.patch])); d.dataset.done = "1";
}, true);
const patchList = (hs, keep) => hs.flatMap(h => (COMMITS[h]?.files || []).filter(f => COMMITS[h].patches?.[f[0]] !== undefined && keep(f[0])).map(f => [h, f[0], f[1], f[2]]));

/* ---------- verdicts ---------- */
const VERDICTS = D.verdicts || [{key: "approve", label: "Approve", kind: "ok"}, {key: "change", label: "Needs changes", kind: "warn"}, {key: "drop", label: "Drop", kind: "bad"}, {key: "park", label: "Park", kind: "nt"}];
const VKEY = "branch-review:" + (D.storageKey || D.pageTitle || D.title);
let VS = {};
try { VS = JSON.parse(localStorage.getItem(VKEY) || "{}"); } catch (e) {}
const saveVS = () => { try { localStorage.setItem(VKEY, JSON.stringify(VS)); } catch (e) {} };
const REVIEWED = () => ITEMS.filter(i => i.review);
function verdictHTML(it){
  const v = VS[it.id] || {};
  return `<div class="verdict" data-v="${esc(it.id)}"><span class="vl">Your call</span>${VERDICTS.map(o =>
    `<button class="${o.kind}${v.k === o.key ? " on" : ""}" data-vk="${o.key}">${esc(o.label)}${it.rec === o.key ? "<small>my pick</small>" : ""}</button>`).join("")}<textarea placeholder="Note (optional)">${esc(v.note || "")}</textarea></div>`;
}
function refreshNav(){
  document.querySelectorAll("#nav [data-item]").forEach(b => {

  });

  const n = REVIEWED().filter(i => VS[i.id]?.k).length, btn = $("#vcopy");
  if (btn) btn.textContent = `Copy my calls · ${n}/${REVIEWED().length}`;
}
function verdictText(){
  return [`${D.title} ${D.subtitle || ""}: my calls`.trim(), ...REVIEWED().map(i => {
    const v = VS[i.id] || {}, o = VERDICTS.find(x => x.key === v.k);
    return `- ${i.label}: ${o ? o.label : "no call yet"}${v.note ? ` (${v.note.trim()})` : ""}`; })].join("\n");
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-vk]"); if (!b) return;
  const id = b.closest("[data-v]").dataset.v, v = VS[id] ||= {};
  v.k = v.k === b.dataset.vk ? undefined : b.dataset.vk; saveVS();

});
document.addEventListener("input", e => {
  const box = e.target.closest?.("[data-v]"); if (!box || e.target.tagName !== "TEXTAREA") return;
  (VS[box.dataset.v] ||= {}).note = e.target.value; saveVS(); refreshNav();
});

/* ---------- blocks ---------- */
const cmdHTML = c => `<div class="cmd"><code>${esc(c)}</code><button data-copy="${esc(c)}">Copy</button></div>`;
const labelHTML = t => t ? `<p class="label">${t}</p>` : "";
const BLOCKS = {
  ba: b => {
    const side = (s, isAfter) => `<div class="side"><div class="ver"><span>${esc(s.title)}</span><span>${esc(s.note || "")}</span></div>${s.rows.map(r => {
      const inner = `<span class="txt">${esc(r.text)}${r.why ? `<span class="why">${esc(r.why)}</span>` : ""}</span>${r.tag ? `<span class="tag ${r.tagKind || ""}">${esc(r.tag)}</span>` : ""}`;
      return r.item ? `<button class="row" data-item="${esc(r.item)}">${inner}</button>` : `<div class="row${r.gone ? " gone" : ""}${isAfter && !r.tag ? " dimrow" : ""}">${inner}</div>`;
    }).join("")}</div>`;
    return `<div>${labelHTML(b.label)}<div class="ba">${side(b.before, false)}<div class="arrow" aria-hidden="true">→</div>${side(b.after, true)}</div></div>`;
  },
  asks: b => `<div>${labelHTML(b.label)}<div class="asks">${b.rows.map(r => {
    const inner = `<i class="sev ${r.sev || ""}"></i><span><b>${r.title}</b><span>${r.text || ""}</span></span>${r.pill ? pill(r.pill[0], r.pill[1]) : "<span></span>"}`;
    return r.item ? `<button class="ask" data-item="${esc(r.item)}">${inner}</button>` : `<div class="ask">${inner}</div>`;
  }).join("")}</div></div>`,
  path: b => `<div>${labelHTML(b.label)}<div class="path">${b.steps.map(s => `<span class="st2">${esc(s)}</span>`).join("→")}${b.link ? `→<button class="cc" data-item="${esc(b.link.item)}"><span>${esc(b.link.text)}</span></button>` : ""}</div></div>`,
  steps: b => `<div>${labelHTML(b.label)}<ol class="steps">${b.rows.map(r => `<li class="${r.done ? "done" : ""}"><div><b>${r.title}</b>${r.text ? `<p>${r.text}${r.item ? ` <button class="cc" data-item="${esc(r.item)}" style="margin-left:4px"><span>${esc(r.itemText || "Open")}</span></button>` : ""}</p>` : ""}${(r.cmds || []).map(cmdHTML).join("")}</div></li>`).join("")}</ol></div>`,
  mock: b => `<div>${labelHTML(b.label)}<div class="mock" data-mock='${esc(JSON.stringify([b.a, b.b]))}'><div class="meta"><span>${esc(b.meta?.[0] || "")}</span><span>${esc(b.meta?.[1] || "")}</span></div><div class="t">${esc(b.a.text)}</div><button data-mock-toggle="0">${esc(b.a.btn)}</button></div></div>`,
  group: b => {
    const hit = p => b.files.some(k => k.startsWith("^") ? p.startsWith(k.slice(1)) : p.includes(k));  // "^path" anchors at the start
    const fs = (b.commits || []).flatMap(h => (COMMITS[h]?.files || []).filter(f => hit(f[0])));
    const [a, d] = totals(fs);
    const rows = (b.rows || []).map(([k, t]) => `<dt class="${esc(k)}">${esc(k)}</dt><dd>${t}</dd>`).join("");
    return `<div class="gblock"><h4>${esc(b.label)}${b.status ? pill(b.status[0], b.status[1]) : ""}<span class="num">${fs.length} files · <span style="color:var(--add)">+${a.toLocaleString()}</span> <span style="color:var(--del)">−${d.toLocaleString()}</span></span>${b.item ? `<button class="cc" data-item="${esc(b.item)}" style="margin-left:auto"><span>${esc(b.itemText || "Your call")} →</span></button>` : ""}</h4>${rows ? `<dl class="gdl">${rows}</dl>` : ""}${diffRows(patchList(b.commits || [], hit))}</div>`;
  },
  table: b => `<div>${labelHTML(b.label)}<div style="overflow-x:auto"><table class="tbl"><thead><tr>${b.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r =>
    r.section ? `<tr class="sec"><td colspan="${b.head.length}">${esc(r.section)}</td></tr>` : `<tr>${r.map(c => `<td>${Array.isArray(c) ? pill(c[0], c[1]) : c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`,
  html: b => b.html,
};
const blocksHTML = bs => (bs || []).map(b => (BLOCKS[b.type] || (() => ""))(b)).join("");

/* ---------- detail ---------- */
function commitChips(hs){
  return `<div class="ccs">${hs.map(h => { const c = COMMITS[h]; if (!c) return "";
    return `<button class="cc" data-commit="${h}"><i class="sw" style="${c.state === "local" ? `border:2px solid ${streamVar(c.stream)};background:transparent` : `background:${streamVar(c.stream)}`}"></i><code>${h}</code><span>${esc(c.subject)}</span></button>`; }).join("")}</div>`;
}
function renderItem(it){
  const hs = it.commits || [];
  const eyebrow = `<div class="eyebrow">${it.status ? pill(it.status[0], it.status[1]) : ""}${it.where ? `<span>on</span><code>${esc(it.where)}</code>` : ""}${hs.length ? `<span>· ${hs.length} commit${hs.length > 1 ? "s" : ""}</span>` : ""}${it.eyebrow ? `<span>${it.eyebrow}</span>` : ""}</div>`;
  const callouts = (it.callouts || []).map(c => `<div class="callout ${c.sev || ""}"><h5>${c.h}</h5>${c.p ? `<p>${c.p}</p>` : ""}${c.ol ? `<ol>${c.ol.map(x => `<li>${x}</li>`).join("")}</ol>` : ""}${c.ul ? `<ul>${c.ul.map(x => `<li>${x}</li>`).join("")}</ul>` : ""}</div>`).join("");
  let side = "";
  if (it.shots?.length) {
    const s0 = it.shots[0];
    const seg = it.shots.length > 1 ? `<span class="seg">${it.shots.map((s, i) => `<button data-shot="${esc(s.img)}" data-cap="${esc(s.cap)}" class="${i ? "" : "on"}">${esc(s.tab || `View ${i + 1}`)}</button>`).join("")}</span>` : "";
    side = `<figure class="shot"><img id="shotimg" src="${D.images?.[s0.img] || ""}" alt="${esc(s0.cap)}"><figcaption><span id="shotcap">${esc(s0.cap)}</span>${seg}</figcaption></figure>`;
  } else if (it.mock) side = BLOCKS.mock(it.mock);
  const bullets = it.bullets?.length ? `<div>${labelHTML(it.bulletsLabel || "What it does")}<ul class="bul">${it.bullets.map(b => `<li>${b}</li>`).join("")}</ul>${(it.cmds || []).map(cmdHTML).join("")}</div>` : (it.cmds || []).map(cmdHTML).join("");
  return `<div class="pane">
    ${eyebrow}
    <h2>${esc(it.title || it.label)}</h2>
    ${it.lede ? `<p class="lede">${it.lede}</p>` : ""}
    ${it.review ? verdictHTML(it) : ""}
    ${callouts}
    ${blocksHTML(it.blocks)}
    ${side ? `<div class="cols">${bullets || "<div></div>"}<div>${side}</div></div>` : bullets}
    ${hs.length ? `<section class="hood"><div class="hood-h"><b>Under the hood</b><span>the commits behind this board · open one for its files and diffs · hover to copy its id</span></div>${commitChips(hs)}</section>` : ""}
  </div>`;
}
const COPY_ICON = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5v-2a1.5 1.5 0 0 0-1.5-1.5H4a1.5 1.5 0 0 0-1.5 1.5v5A1.5 1.5 0 0 0 4 10.5h1.5"/></svg>`;
const CHECK_ICON = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>`;
const hashHTML = h => `<button class="hash" data-copyid="${esc(h)}" title="Copy commit id">${esc(h)}${COPY_ICON}<span class="ok">Copied</span></button>`;
// Every commit chip, wherever it was rendered (lists, tables, blocks), gets a hover copy button.
function decorateCommitChips(root){
  root.querySelectorAll(".cc[data-commit]").forEach(b => {
    if (b.parentElement.classList.contains("cchip")) return;
    const wrap = document.createElement("span"); wrap.className = "cchip";
    b.replaceWith(wrap); wrap.appendChild(b);
    wrap.insertAdjacentHTML("beforeend", `<button class="cpy" data-copyid="${esc(b.dataset.commit)}" title="Copy ${esc(b.dataset.commit)}" aria-label="Copy commit id ${esc(b.dataset.commit)}">${COPY_ICON}</button>`);
  });
}
function copyId(btn){
  const t = btn.dataset.copyid;
  const done = () => { btn.classList.add("done"); if (btn.classList.contains("cpy")) btn.innerHTML = CHECK_ICON;
    setTimeout(() => { btn.classList.remove("done"); if (btn.classList.contains("cpy")) btn.innerHTML = COPY_ICON; }, 1200); };
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(done).catch(() => {
    const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) {} ta.remove();
  });
}
function drawExplainer(){
  const ex = D.explainer || {};
  const cols = [
    ["What this is", ex.what || `${esc(D.title)}${D.subtitle ? ` · ${esc(D.subtitle)}` : ""}: the work in this repository, laid out so you can see what was done and decide what happens next.`],

    ["Boards and commits", ex.boards || `The list on the left holds <b>boards</b>: one piece of work each, in plain language. A board's commits and diffs sit at its foot, under <i>Under the hood</i>. A <b>commit</b> page has a dark COMMIT tag and a coloured edge. Hover any commit id to copy it.`],

function setExplainer(open){

  try { localStorage.setItem(VKEY + ":explainer", open ? "open" : "closed"); } catch (e) {}

function laneSteps(c){
  const lane = Object.values(COMMITS).filter(x => x.lane === c.lane).sort((a, b) => a.col - b.col);
  const i = lane.findIndex(x => x.h === c.h);
  const older = lane[i - 1] || (c.parents?.[0] && COMMITS[c.parents[0]]) || null;
  return {older, newer: lane[i + 1] || null, branchPoint: !lane[i - 1] && !!older};
}
function renderCommit(c){
  const items = itemsOf(c.h);
  const lane = D.lanes[c.lane]?.name || "";
  const state = c.state === "local" ? pill("warn", "not pushed") : c.state === "base" ? pill("nt", "starting point") : pill("ok", "pushed");
  const body = c.message.split("\n").slice(1).join("\n").trim();
  const from = LAST_ITEM && BY_ID[LAST_ITEM], st = laneSteps(c);
  const step = (x, dir, note) => x ? `<button class="cstep" data-commit="${esc(x.h)}" title="${esc(`${x.h} · ${x.subject}`)}">${dir === "older" ? "‹ " : ""}<b>${note}</b><code>${esc(x.h)}</code><span>${esc(x.subject)}</span>${dir === "newer" ? " ›" : ""}</button>` : "";
  return `<div class="pane commit-pane">
    <div class="cnav">${from ? `<button class="back" data-item="${esc(from.id)}">← ${esc(from.label)}</button>` : `<span class="back" style="visibility:hidden">.</span>`}${step(st.older, "older", st.branchPoint ? "Branch point" : "Older")}${step(st.newer, "newer", "Newer")}</div>
    <div class="eyebrow"><span class="kind commit">Commit</span>${hashHTML(c.h)}${state}<span>${esc(c.date)}</span><span>on</span><code>${esc(lane)}</code></div>
    <h2>${esc(c.subject)}</h2>
    ${items.length ? `<div>${labelHTML("Part of")}<div class="ccs">${items.map(i => `<button class="cc" data-item="${esc(i.id)}"><i class="sw" style="background:${i.stream ? streamVar(i.stream) : "var(--ink)"}"></i><span>${esc(i.label)}</span></button>`).join("")}</div></div>` : ""}
    ${body ? `<div>${labelHTML("Commit message")}<pre class="msg">${esc(body)}</pre></div>` : ""}
    ${c.patches ? (d => d ? `<div>${labelHTML("The changes <span>· open a file to read its diff</span>")}${d}</div>` : "")(diffRows(patchList([c.h], () => true))) : ""}
    ${(rest => rest.length ? `<div>${labelHTML(`${c.patches ? "Files without a diff here" : "Files"} · ${totalsHTML(rest)}`)}${filesHTML(rest)}</div>` : "")(c.files.filter(f => !c.patches || c.patches[f[0]] === undefined))}
  </div>`;
}

/* ---------- selection and interaction ---------- */
let LAST_ITEM = null;
const NARROW = () => matchMedia("(max-width:1000px)").matches;
let BB_STEP = {prev: null, next: null};
function setDrawer(open){ $("#nav").classList.toggle("open", open); $("#bb-list").setAttribute("aria-expanded", String(open)); }
function drawBoardbar(sel){

  $("#bb-cur").innerHTML = it ? `<b>${esc(it.label)}</b><span class="bb-st">${esc(v ? v.label : (it.status?.[1] || it.group))}</span>` : c ? `<b>Commit</b><code>${esc(c.h)}</code><span class="bb-st">${esc(D.lanes[c.lane]?.name || "")}</span>` : "";

    const st = laneSteps(c); pv = st.older && {commit: st.older.h}; nx = st.newer && {commit: st.newer.h};
    pvName = st.older ? `${st.older.h} ${st.older.subject}` : ""; nxName = st.newer ? `${st.newer.h} ${st.newer.subject}` : "";
  } else {
    const i = ITEMS.findIndex(x => x.id === (it ? it.id : LAST_ITEM)), p = ITEMS[i - 1], n = i >= 0 ? ITEMS[i + 1] : null;

  $("#bb-prev").disabled = !pv; $("#bb-next").disabled = !nx;

}
const EYE_OPEN = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6S1.5 10 1.5 10z"/><circle cx="10" cy="10" r="2.6"/></svg>', EYE_SHUT = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2.5 7.5S5.2 12 10 12s7.5-4.5 7.5-4.5"/><path d="M5 10.6l-1.6 2M10 12v2.6M15 10.6l1.6 2"/></svg>';
function setGraph(show, remember = true){

function select(sel, how = "push"){
  document.querySelectorAll("#nav [data-item]").forEach(b => b.classList.toggle("on", sel.item ? b.dataset.item === sel.item : false));
  const d = $("#detail");

  else { const c = COMMITS[sel.commit]; d.innerHTML = renderCommit(c); highlight(null, c.h); }
  decorateCommitChips(d);
  drawBoardbar(sel); setDrawer(false);
  d.scrollTop = 0;
  const hash = "#" + (sel.item || sel.commit);
  try { if (how === "push" && location.hash !== hash) history.pushState(null, "", hash); else if (how === "replace") history.replaceState(null, "", hash); } catch (e) {}
}
const fromHash = () => { const h = decodeURIComponent((location.hash || "").slice(1)); return BY_ID[h] ? {item: h} : COMMITS[h] ? {commit: h} : null; };
window.addEventListener("popstate", () => { const s = fromHash(); if (s) select(s, "none"); });
window.addEventListener("hashchange", () => { const s = fromHash(); if (s) select(s, "none"); });
document.addEventListener("click", e => {
  const ci = e.target.closest("[data-copyid]");
  if (ci) { e.preventDefault(); e.stopPropagation(); copyId(ci); return; }
}, true);
document.addEventListener("click", e => {
  const cp = e.target.closest("[data-copy]");
  if (cp) { const t = cp.dataset.copy, lbl = cp.textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { cp.textContent = "Copied"; setTimeout(() => cp.textContent = lbl, 1300); })
      .catch(() => { const r = document.createRange(); r.selectNodeContents(cp.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
    return; }
  const sh = e.target.closest("[data-shot]");
  if (sh) { $("#shotimg").src = D.images?.[sh.dataset.shot] || ""; $("#shotcap").textContent = sh.dataset.cap; sh.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === sh)); return; }
  const mt = e.target.closest("[data-mock-toggle]");
  if (mt) { const box = mt.closest(".mock"), states = JSON.parse(box.dataset.mock), i = mt.dataset.mockToggle === "0" ? 1 : 0, s = states[i], t = box.querySelector(".t");
    t.textContent = s.text; t.classList.toggle("mono", !!s.mono); mt.textContent = s.btn; mt.dataset.mockToggle = String(i); return; }
  if (e.target.closest("#detail")) {
    const c = e.target.closest("[data-commit]"); if (c) return select({commit: c.dataset.commit});
    const i = e.target.closest("[data-item]"); if (i) return select({item: i.dataset.item});
  }
});

drawGraph(); drawNav();
if (REVIEWED().length) { $("#actions").insertAdjacentHTML("afterbegin", `<button class="vcopy" id="vcopy" data-copy="">Copy my calls</button>`);
  $("#vcopy").addEventListener("click", () => { $("#vcopy").dataset.copy = verdictText(); }, true); }
refreshNav();
drawExplainer();
$("#bb-list").addEventListener("click", e => { e.stopPropagation(); setDrawer(!$("#nav").classList.contains("open")); });
$("#bb-prev").addEventListener("click", () => { if (BB_STEP.prev) select(BB_STEP.prev); });
$("#bb-next").addEventListener("click", () => { if (BB_STEP.next) select(BB_STEP.next); });
document.addEventListener("click", e => { if ($("#nav").classList.contains("open") && !e.target.closest("#nav") && !e.target.closest("#boardbar")) setDrawer(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { setDrawer(false); if ($("#explainer").classList.contains("open")) setExplainer(false); } });
$("#geye").addEventListener("click", () => setGraph($(".app").classList.contains("nograph")));
$("#zin").addEventListener("click", () => zoomTo(ZOOM + 1));
$("#zout").addEventListener("click", () => zoomTo(ZOOM - 1));
$("#zfit").addEventListener("click", () => zoomTo(0));
graphEvents(); zoomTo(0);
let gpref = null; try { gpref = localStorage.getItem(VKEY + ":graph"); } catch (e) {}
setGraph(gpref !== "hidden", false);
// Refit when the window changes size, unless you've zoomed in.
let fitTimer; new ResizeObserver(() => { clearTimeout(fitTimer); fitTimer = setTimeout(() => { if (ZOOM === 0) { drawGraph(); highlight(...HL); } }, 80); }).observe($("#gscroll"));
$("#helpbtn").addEventListener("click", () => setExplainer(!$("#explainer").classList.contains("open")));
$("#explainer").addEventListener("click", e => { if (e.target.id === "helpclose") setExplainer(false); });
let seen = null; try { seen = localStorage.getItem(VKEY + ":explainer"); } catch (e) {}
setExplainer(seen !== "closed");
const start = decodeURIComponent((location.hash || "").slice(1));
select(BY_ID[start] ? {item: start} : COMMITS[start] ? {commit: start} : ITEMS.length ? {item: ITEMS[0].id} : {commit: D.commits[D.commits.length - 1].h}, "replace");
</script>
